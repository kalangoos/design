# Fly.io app for figcraft-server (view/edit share for kalangoos/design).
# Free plan: ~$2.2/mo always-on shared-cpu-1x 256MB in iad + $0.15/GB volume — needs card for $5/mo credit.
#
# First time (from this directory):
#   fly auth login
#   fly apps create kalangoos-figcraft
#   fly volumes create figcraft_data --region iad --size 1   # >1 GB needs a payment method
#   fly deploy
#   fly ssh console -C '/usr/local/bin/figcraft-server --config /etc/figcraft-server/server.toml key'
#
# Health: curl -fsS https://kalangoos-figcraft.fly.dev/healthz

app = "kalangoos-figcraft"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  RUST_LOG = "info"

[http_service]
  internal_port = 47900
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  # Welcome carries the whole file (~170 MiB Design System); 256 MB OOMs on publish.
  memory = "1024mb"

[mounts]
  source = "figcraft_data"
  destination = "/data"
